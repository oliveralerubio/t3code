name: Fork Nightly AppImage

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream T3 Code release tag that matches downstream/overlay.json
        required: true
        default: v0.0.33
        type: string

# This workflow publishes only the Linux desktop prerelease for this fork. It
# builds a disposable upstream release tree and applies the maintained
# downstream overlay before compiling. It does not publish the fork's full
# source tree as the build input.
concurrency:
  group: fork-nightly-appimage-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate Linux x64 nightly
    if: >-
      github.repository == 'oliveralerubio/t3code' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      name: ${{ steps.release_meta.outputs.name }}
      upstream_ref: ${{ steps.downstream_source.outputs.upstream_ref }}
      source_sha: ${{ steps.downstream_source.outputs.source_sha }}
    env:
      # The desktop packager writes these coordinates into electron-updater
      # metadata. They are validated from the finished AppImage below.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout downstream overlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: downstream_source
        name: Fetch upstream release and apply downstream overlay
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          overlay_staging="$RUNNER_TEMP/t3-downstream-overlay"
          mkdir -p "$overlay_staging"
          cp -R "$GITHUB_WORKSPACE/downstream" "$overlay_staging/downstream"
          cp "$GITHUB_WORKSPACE/scripts/apply-downstream-overlay.sh" "$overlay_staging/"
          cp "$GITHUB_WORKSPACE/scripts/apply-downstream-overlay.test.ts" "$overlay_staging/"
          manifest="$overlay_staging/downstream/overlay.json"
          readarray -t manifest_metadata < <(node --input-type=module - "$manifest" <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync(process.argv[2], "utf8"));
          console.log(manifest.upstreamRef);
          console.log(manifest.upstreamCommit);
          console.log(manifest.patch);
          NODE
          )"
          manifest_ref="${manifest_metadata[0]}"
          expected_upstream_commit="${manifest_metadata[1]}"
          patch_name="${manifest_metadata[2]}"
          upstream_ref="${REQUESTED_UPSTREAM_REF:-$manifest_ref}"
          if [[ "$manifest_ref" != "$upstream_ref" ]]; then
            echo "Workflow upstream_ref '$upstream_ref' does not match overlay manifest '$manifest_ref'." >&2
            echo "Regenerate the overlay for the new upstream release before building it." >&2
            exit 1
          fi
          if [[ ! "$upstream_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]{8}\.[0-9]+)?$ ]]; then
            echo "Refusing non-release upstream ref: $upstream_ref" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote "https://github.com/pingdotgg/t3code.git" \
            "refs/tags/${upstream_ref}" "refs/tags/${upstream_ref}^{}")"
          actual_upstream_commit="$(awk -v ref="refs/tags/${upstream_ref}^{}" '$2 == ref { print $1; exit }' <<<"$tag_refs")"
          if [[ -z "$actual_upstream_commit" ]]; then
            actual_upstream_commit="$(awk -v ref="refs/tags/${upstream_ref}" '$2 == ref { print $1; exit }' <<<"$tag_refs")"
          fi
          if [[ "$actual_upstream_commit" != "$expected_upstream_commit" ]]; then
            echo "Upstream tag $upstream_ref resolved to '$actual_upstream_commit', expected '$expected_upstream_commit'." >&2
            exit 1
          fi
          overlay_patch="$overlay_staging/downstream/$patch_name"
          test -f "$overlay_patch"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 \
            https://github.com/pingdotgg/t3code.git "$expected_upstream_commit"
          generated_patch="$RUNNER_TEMP/generated-downstream-overlay.patch"
          git -C "$GITHUB_WORKSPACE" diff --binary --full-index "$expected_upstream_commit" -- \
            . \
            ':(exclude).github' \
            ':(exclude)docs/downstream-releases.md' \
            ':(exclude)downstream' \
            ':(exclude)scripts/apply-downstream-overlay.sh' \
            ':(exclude)scripts/apply-downstream-overlay.test.ts' \
            ':(exclude)scripts/sync-upstream.sh' \
            > "$generated_patch"
          if ! cmp -s "$generated_patch" "$overlay_patch"; then
            echo "The committed downstream overlay does not match the triggering source commit." >&2
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" remote get-url upstream >/dev/null 2>&1 || \
            git -C "$GITHUB_WORKSPACE" remote add upstream https://github.com/pingdotgg/t3code.git
          git -C "$GITHUB_WORKSPACE" checkout --detach "$expected_upstream_commit"
          cp "$overlay_staging/apply-downstream-overlay.sh" \
            "$GITHUB_WORKSPACE/scripts/apply-downstream-overlay.sh"
          cp "$overlay_staging/apply-downstream-overlay.test.ts" \
            "$GITHUB_WORKSPACE/scripts/apply-downstream-overlay.test.ts"
          bash "$overlay_staging/apply-downstream-overlay.sh" \
            --manifest "$manifest" \
            --source-dir "$GITHUB_WORKSPACE" \
            --apply
          test -f "$GITHUB_WORKSPACE/apps/server/src/provider/Drivers/AntigravityDriver.ts"
          for quality_gate in \
            apps/server/src/provider/piRpcManager.test.ts \
            apps/server/src/provider/piRpcProtocol.test.ts \
            apps/server/src/provider/Layers/AntigravityAdapter.test.ts \
            apps/web/src/components/settings/providerDriverMeta.test.ts \
            scripts/apply-downstream-overlay.test.ts; do
            test -f "$GITHUB_WORKSPACE/$quality_gate"
          done
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Run downstream quality gates
        run: |
          set -euo pipefail
          vp test run \
            apps/server/src/provider/piRpcManager.test.ts \
            apps/server/src/provider/piRpcProtocol.test.ts \
            apps/server/src/provider/Layers/AntigravityAdapter.test.ts \
            apps/web/src/components/settings/providerDriverMeta.test.ts \
            scripts/apply-downstream-overlay.test.ts
          pnpm run typecheck

      - id: release_meta
        name: Resolve nightly version and unique release tag
        shell: bash
        env:
          NIGHTLY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          nightly_date="$(date -u +%Y%m%d)"
          metadata_file="$RUNNER_TEMP/nightly-release-metadata"
          GITHUB_OUTPUT="$metadata_file" node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$NIGHTLY_SHA" \
            --github-output

          grep -Ev '^(tag|name)=' "$metadata_file" >> "$GITHUB_OUTPUT"
          # Electron-updater derives prerelease channels from a semver Git tag,
          # so the release tag must remain the canonical v<version> form.
          version="$(sed -n 's/^version=//p' "$metadata_file")"
          short_sha="$(sed -n 's/^short_sha=//p' "$metadata_file")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "name=T3 Code Fork Nightly ${version} (${short_sha})" >> "$GITHUB_OUTPUT"

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Build Linux x64 AppImage and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ steps.release_meta.outputs.version }}" \
            --verbose

      - name: Collect and validate release assets
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          assets=(release/*.AppImage release/*.yml)
          if ((${#assets[@]} == 0)); then
            echo "The desktop build did not produce release assets." >&2
            exit 1
          fi
          cp "${assets[@]}" release-publish/

          mapfile -t appimages < <(find release-publish -maxdepth 1 -type f -name '*.AppImage' -printf '%f\n' | sort)
          if ((${#appimages[@]} != 1)); then
            echo "Expected exactly one AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          appimage="${appimages[0]}"
          manifest="release-publish/nightly-linux.yml"
          if [[ ! -f "$manifest" ]]; then
            echo "Expected the nightly updater manifest at $manifest." >&2
            exit 1
          fi
          node --input-type=module - "$manifest" "release-publish/$appimage" "$EXPECTED_VERSION" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { basename } from "node:path";

          const [manifestPath, appImagePath, expectedVersion] = process.argv.slice(2);
          const manifest = readFileSync(manifestPath, "utf8");
          const scalar = (key) => {
            const match = manifest.match(new RegExp(`^${key}:\\s*(.+?)\\s*$`, "m"));
            return match?.[1]?.replace(/^['"]|['"]$/g, "");
          };
          const fail = (message) => {
            console.error(`Invalid nightly updater manifest: ${message}`);
            process.exit(1);
          };

          if (scalar("version") !== expectedVersion) fail("version does not match the release version");
          const appImageName = basename(appImagePath);
          if (scalar("path") !== appImageName) fail("path does not name the AppImage asset");
          const urls = [...manifest.matchAll(/^\s*-\s+url:\s*(.+?)\s*$/gm)].map((match) =>
            match[1].replace(/^['"]|['"]$/g, ""),
          );
          if (urls.length !== 1 || urls[0] !== appImageName) {
            fail("files must reference exactly the published AppImage asset");
          }
          const expectedSha512 = scalar("sha512");
          const actualSha512 = createHash("sha512").update(readFileSync(appImagePath)).digest("base64");
          if (expectedSha512 !== actualSha512) fail("sha512 does not match the AppImage asset");
          NODE

          extraction_dir="$(mktemp -d)"
          trap 'rm -rf "$extraction_dir"' EXIT
          (
            cd "$extraction_dir"
            "${GITHUB_WORKSPACE}/release-publish/${appimage}" --appimage-extract >/dev/null
          )
          app_update="$(find "$extraction_dir/squashfs-root" -type f -path '*/resources/app-update.yml' -print -quit)"
          if [[ -z "$app_update" ]]; then
            echo "The AppImage does not contain electron-updater configuration." >&2
            exit 1
          fi
          expected_owner="${EXPECTED_REPOSITORY%%/*}"
          expected_repo="${EXPECTED_REPOSITORY#*/}"
          grep -Fx 'provider: github' "$app_update"
          grep -Fx "owner: ${expected_owner}" "$app_update"
          grep -Fx "repo: ${expected_repo}" "$app_update"
          grep -Fx 'releaseType: prerelease' "$app_update"
          grep -Fx 'channel: nightly' "$app_update"

      - name: Upload validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-nightly-appimage
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish Linux x64 nightly
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-nightly-appimage
          path: release-publish

      - name: Publish fork nightly prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          target_commitish: ${{ needs.build.outputs.source_sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-publish/*.AppImage
            release-publish/*.yml
